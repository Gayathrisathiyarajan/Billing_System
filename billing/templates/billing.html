<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Billing Page</title>
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background-color: #f9fafb;
            margin: 0;
            padding: 20px;
        }

        h2 {
            color: #333;
            text-align: center;
            margin-bottom: 25px;
        }

        .container {
            max-width: 900px;
            background: white;
            margin: 0 auto;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background-color: #fefefe;
        }

        label {
            display: inline-block;
            font-weight: 600;
            color: #444;
            margin-right: 10px;
        }

        input[type="email"], input[type="number"], input[list] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            width: 200px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #e5e7eb;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f3f4f6;
            color: #333;
            font-weight: 600;
        }

        tr:nth-child(even) {
            background-color: #fafafa;
        }

        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-cancel {
            background: #d1d5db;
            color: #111;
        }

        .btn-generate {
            background: #22c55e;
            color: white;
        }

        .btn-history {
            background: #2563eb;
            color: white;
            margin-left: 15px;
        }

        #add-row {
            background: #f59e0b;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 6px 10px;
            margin-top: 8px;
            cursor: pointer;
        }

        #add-row:hover {
            background: #d97706;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🧾 Billing Page</h2>

        <div class="section">
            <label>Customer Email:</label>
            <input type="email" name="customer_email" id="customer_email" form="billForm" required>

            <!-- Previous purchases -->
            <form id="previousForm" method="post" action="{% url 'billing:purchases_list' %}" style="display:inline;">
                {% csrf_token %}
                <input type="hidden" name="email" id="hiddenEmail">
                <button type="submit" id="previousBtn" class="btn btn-history" style="display:none;">
                    View Previous Purchases
                </button>
            </form>
        </div>

        <form id="billForm" method="post" action="{% url 'billing:generate_bill' %}">
            {% csrf_token %}
            <div class="section">
                <h3>🛒 Bill Section</h3>
                <table id="items-table">
                    <thead>
                        <tr>
                            <th>Product ID</th>
                            <th>Quantity</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="item-row">
                            <td>
                                <input name="product_id[]" list="productList" required>
                                <datalist id="productList">
                                    {% for p in products %}
                                        <option value="{{ p.product_code }}">{{ p.name }} - ₹{{ p.unit_price }}</option>
                                    {% endfor %}
                                </datalist>
                            </td>
                            <td><input type="number" name="quantity[]" value="1" min="1" required></td>
                            <td><button type="button" class="remove-row btn btn-cancel">Remove</button></td>
                        </tr>
                    </tbody>
                </table>
                <button id="add-row" type="button">Add New Item</button>
            </div>

            <div class="section">
                <h3>💰 Denominations</h3>
                <table>
                    {% for d in denominations %}
                    <tr>
                        <td>₹{{ d.value }}</td>
                        <td><input type="number" name="denom_{{ d.value }}" value="0" min="0"></td>
                    </tr>
                    {% endfor %}
                </table>
            </div>

            <div class="section">
                <label>Customer Paid Amount:</label>
                <input type="number" name="paid_amount" step="0.01" required>
            </div>

            <div style="text-align:center; margin-top:15px;">
                <button type="reset" class="btn btn-cancel">Cancel</button>
                <button type="submit" class="btn btn-generate">Generate Bill</button>
            </div>
        </form>
    </div>

    <script>
        document.getElementById("customer_email").addEventListener("change", function () {
            const email = this.value;
            const btn = document.getElementById("previousBtn");
            const hiddenInput = document.getElementById("hiddenEmail");
            if (email) {
                fetch(`/check_previous/?email=${encodeURIComponent(email)}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.exists) {
                            hiddenInput.value = email;
                            btn.style.display = "inline-block";
                        } else {
                            btn.style.display = "none";
                        }
                    });
            } else {
                btn.style.display = "none";
            }
        });

        document.getElementById('add-row').addEventListener('click', function(){
            const tbody = document.querySelector('#items-table tbody');
            const row = document.querySelector('.item-row').cloneNode(true);
            row.querySelectorAll('input').forEach(i => i.value = (i.type === 'number') ? 1 : '');
            tbody.appendChild(row);
        });

        document.addEventListener('click', function(e){
            if(e.target.matches('.remove-row')){
                const rows = document.querySelectorAll('.item-row');
                if(rows.length > 1) e.target.closest('tr').remove();
            }
        });
    </script>
</body>
</html>
